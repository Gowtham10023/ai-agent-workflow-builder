version: '3.9'
services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_workflows
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
  hasura:
    image: hasura/graphql-engine:v2.24.0
    depends_on:
      - postgres
    ports:
      - '8080:8080'
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://postgres:postgres@postgres:5432/ai_workflows
      HASURA_GRAPHQL_ENABLE_CONSOLE: 'true'
      HASURA_GRAPHQL_ADMIN_SECRET: '${HASURA_ADMIN_SECRET:-hasura-admin-secret}'
      HASURA_GRAPHQL_METADATA_DATABASE_URL: postgres://postgres:postgres@postgres:5432/ai_workflows
      HASURA_GRAPHQL_ENABLE_TELEMETRY: 'false'
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: 'anonymous'
    command:
      - graphql-engine
      - serve
      - --server-port
      - '8080'
volumes:
  postgres_data:
